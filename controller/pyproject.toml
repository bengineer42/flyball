[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flyball"
description = "Closed-loop control of a quantity with an actuator: control laws, runtime, telemetry, identification"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ben Laurence" }]
dynamic = ["version"]

# Core has no required dependencies. The pure controller, the Device protocol,
# the simulated plant and the SQLite store are all stdlib-only, so downstream
# consumers can depend on the algorithm without pulling in a serial stack.
dependencies = []

classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
# FastAPI won: flyball.server needs its WebSocket support for live telemetry
# and pydantic for request validation. uvicorn is the ASGI server.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
all = ["flyball[serial,web]"]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "types-pyserial",
    "ipykernel>=7.3.0",
]

[tool.hatch.version]
path = "src/flyball/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flyball"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
preview = true


[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF",
    "D",   # pydocstyle
]

# Docstrings are Google style. The missing-docstring rules stay off: the house
# style documents what needs explaining, not every definition.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

# Greek quantity and unit symbols (ρ, µ, Ω...) are the SI's, not typos.
allowed-confusables = ["α", "γ", "ε", "η", "λ", "µ", "μ", "ν", "ρ", "σ", "ω", "Ω", "Φ", "Θ"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["flyball"]
strict = true
warn_unreachable = true

# Enforces the layering by hand rather than by splitting into separate
# distributions: control/device/store are mutually independent, and nothing
# below may import anything above. Run with `lint-imports`.
[tool.importlinter]
root_packages = ["flyball"]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "flyball.web",
    "flyball.runtime",
    "flyball.devices",
    "flyball.control | flyball.device | flyball.store",
    "flyball.types",
]
