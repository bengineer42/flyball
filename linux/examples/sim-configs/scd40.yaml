# Sim for the SCD40/41 driver (config tag `scd40`, `co2`/`temperature`/
# `humidity` [RP], flat -- no base example to overlay yet). Same shape as
# sim-configs/scd30.yaml: co2 tau 90 s, ambient 450 ppm; temperature tau
# 30 s, ambient 21 degC; humidity tau 45 s, ambient 45 %RH.

links:
  co2_plant: { tag: sim_plant, tau_s: 90.0, gain: 1200.0, ambient: 450.0, initial: 450.0, noise: 15.0, seed: 53 }
  temperature_plant: { tag: sim_plant, tau_s: 30.0, gain: 5.0, ambient: 21.0, initial: 21.0, noise: 0.05, seed: 54 }
  humidity_plant: { tag: sim_plant, tau_s: 45.0, gain: 30.0, ambient: 45.0, initial: 45.0, noise: 0.3, seed: 55 }

devices:
  co2:
    driver: sim_daq
    label: CO2 (simulated)
    poll_s: 2
    link: co2_plant
    ports:
      co2: { port: output, quantity: co2, unit: ppm }

  co2_temperature:
    driver: sim_daq
    label: CO2 sensor temperature (simulated)
    poll_s: 2
    link: temperature_plant
    ports:
      temperature: { port: output, quantity: temperature, unit: "°C" }

  co2_humidity:
    driver: sim_daq
    label: CO2 sensor humidity (simulated)
    poll_s: 2
    link: humidity_plant
    ports:
      humidity: { port: output, quantity: humidity, unit: "%RH" }
