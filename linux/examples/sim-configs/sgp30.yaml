# Sim for the SGP30 driver (`sgp30`, `co2eq`/`tvoc` [RP], flat -- no base
# example to overlay yet). Both are the chip's own derived estimates from
# one internal gas signal, but modelling that coupling needs a bespoke
# plant (out of scope, see README); two independent small plants: co2eq
# tau 60 s, ambient 400 ppm eq baseline, gain up to +2000 ppm; tvoc tau
# 60 s, ambient 20 ppb baseline, gain up to +500 ppb.

links:
  co2eq_plant: { tag: sim_plant, tau_s: 60.0, gain: 2000.0, ambient: 400.0, initial: 400.0, noise: 20.0, seed: 60 }
  tvoc_plant: { tag: sim_plant, tau_s: 60.0, gain: 500.0, ambient: 20.0, initial: 20.0, noise: 5.0, seed: 61 }

devices:
  co2eq:
    driver: sim_daq
    label: CO2 equivalent (simulated)
    poll_s: 1
    link: co2eq_plant
    ports:
      co2eq: { port: output, quantity: co2eq, unit: ppm }

  tvoc:
    driver: sim_daq
    label: Total VOC (simulated)
    poll_s: 1
    link: tvoc_plant
    ports:
      tvoc: { port: output, quantity: tvoc, unit: ppb }
