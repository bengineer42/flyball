[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flyball-linux"
version = "0.1.0"
description = "Linux I/O for flyball rigs: I2C, SPI, GPIO, PWM and 1-Wire links and the devices on them"
requires-python = ">=3.12"
authors = [{ name = "Ben Laurence" }]
dependencies = ["flyball"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
# Each bus library only when that bus is used; the configs import without them.
i2c = ["smbus2>=0.4"]
spi = ["spidev>=3.6"]
gpio = ["gpiod>=2.1"]
all = ["flyball-linux[i2c,spi,gpio]"]

# What `flyball rig check`, the daemon and the schema load to make these tags valid.
[project.entry-points."flyball.configs"]
linux = "flyball_linux.configs"

[project.scripts]
flyball-linux = "flyball_linux.probe:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.uv.sources]
flyball = { path = "../controller", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/flyball_linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
extend = "../controller/pyproject.toml"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF", "D"]
