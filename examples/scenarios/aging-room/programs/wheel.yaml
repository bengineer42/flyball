# yaml-language-server: $schema=program.schema.json
# A wheel's humidity schedule: starts wet (bloom), steps down in stages as
# it ages, the way a real cave's setpoint is walked down over weeks. `wait`
# durations below are a live-demo compression of a months-long schedule --
# scale them up (or run at `clock.speed` < 1, the opposite of the furnace
# demo's speed-up) for a real cellar.
#
#     flyball-runner rig.yaml sim.yaml
#     flyball program check --local programs/wheel.yaml
name: wheel-demo
steps:
  - regulate: { controllers: humidifier.drive, setpoint: 95 }
  - wait: { duration: { minutes: 2 }, message: "bloom: high humidity while the rind forms" }

  - ramp: { controllers: humidifier.drive, to: 85, per_minute: 5 }
  - wait: { duration: { minutes: 2 }, message: "early age" }

  - ramp: { controllers: humidifier.drive, to: 75, per_minute: 5 }
  - wait: { duration: { minutes: 2 }, message: "mid age" }

  - ramp: { controllers: humidifier.drive, to: 65, per_minute: 5 }
  - wait: { duration: { minutes: 3 }, message: "late age, drier rind" }

  - manual: humidifier.drive
