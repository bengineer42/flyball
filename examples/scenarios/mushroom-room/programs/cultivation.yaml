# yaml-language-server: $schema=program.schema.json
# Three cultivation phases, each a different humidity/CO2 target held for a
# while -- the same regulate/wait shape as the humidity rig's programs/
# demo.yaml (https://bengineer42.github.io/humctrl/), repeated per phase
# instead of once. Real cultivation runs are
# days-to-weeks per phase; `wait` durations below are shortened for a live
# demo -- scale them up for a real run, or drive `--set clock.speed=...`
# down as `furnace.yaml`'s programs do the opposite for a fast rehearsal.
#
#     flyball-runner rig.yaml sim.yaml
#     flyball program check --local programs/cultivation.yaml
name: cultivation-demo
steps:
  - regulate: { controllers: fogger.drive, setpoint: 65 }
  - regulate: { controllers: fan.drive, setpoint: 5000 }
  - wait: { duration: { minutes: 2 }, message: "colonisation: low humidity, CO2 not yet a concern" }

  - ramp: { controllers: fogger.drive, to: 90, per_minute: 10 }
  - ramp: { controllers: fan.drive, to: 800, per_minute: 2000 }
  - wait: { duration: { minutes: 2 }, message: "pinning: high humidity, fresh-air exchange triggers pinning" }

  - ramp: { controllers: fogger.drive, to: 85, per_minute: 10 }
  - ramp: { controllers: fan.drive, to: 600, per_minute: 2000 }
  - wait: { duration: { minutes: 3 }, message: "fruiting" }

  - manual: [fogger.drive, fan.drive]
