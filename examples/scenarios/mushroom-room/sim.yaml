# yaml-language-server: $schema=rig.schema.json
# Overlay: no hardware. Two independent generic `sim_plant` (fopdt) links --
# humidity and CO2 don't couple to each other here, unlike the humidity
# example's single coupled chamber; that's a real simplification, not a
# bespoke physics model like `sim_humidity_chamber`.

name: mushroom-room-sim
clock: { speed: 1 }

links:
  i2c1: null
  fan_pwm: null
  fogger_pwm: null
  humidity_plant:
    tag: sim_plant
    model: fopdt
    tau_s: 300.0        # a grow tent's air responds slowly to a fogger
    dead_s: 10.0
    gain: 40.0           # full fogger duty adds 40 %RH over the room's ambient
    ambient: 55.0
    initial: 55.0
    noise: 0.3
    seed: 3
  co2_plant:
    tag: sim_plant
    model: fopdt
    tau_s: 180.0
    dead_s: 5.0
    gain: -3000.0         # full fan duty pulls CO2 down 3000 ppm from ambient
    ambient: 5000.0        # unventilated, mycelium-respiring tent runs high
    initial: 5000.0
    noise: 20.0
    seed: 4

devices:
  climate:
    driver: sim_daq
    label: Chamber climate (simulated)
    poll_s: 5
    config:
      link: humidity_plant
      ports:
        chamber.humidity: { port: output, quantity: humidity, unit: "%RH" }
        chamber.temperature: { port: output, quantity: temperature, unit: "°C" }   # not separately modelled; mirrors the address only

  co2:
    driver: sim_daq
    label: CO2 sensor (simulated)
    poll_s: 10
    config:
      link: co2_plant
      ports:
        co2: { port: output, quantity: co2, unit: ppm }

  fogger:
    driver: sim_drive
    label: Ultrasonic fogger (simulated)
    config:
      link: humidity_plant
      ports:
        drive: { port: input }

  fan:
    driver: sim_drive
    label: Exhaust fan (simulated)
    config:
      link: co2_plant
      ports:
        drive: { port: input }
