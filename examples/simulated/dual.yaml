# yaml-language-server: $schema=rig.schema.json
# Two independent loops of different units in one rig: an oven (°C) and a
# tank (L), sharing nothing but the process. Nothing here says a rig file
# is one plant -- `controllers` just lists them, and each names its own
# source signal and target.

name: dual

links:
  chamber:
    tag: sim_plant
    model: fopdt
    tau_s: 60.0
    dead_s: 5.0
    gain: 80.0
    ambient: 20.0
    initial: 20.0
    noise: 0.05
    seed: 1
  tank:
    tag: sim_plant
    model: integrator
    gain: 2.0
    leak: 0.05
    initial: 10.0
    noise: 0.02

devices:
  dual_temp:
    driver: sim_daq
    label: Oven thermocouple
    poll_s: 1.0
    config:
      link: chamber
      ports:
        temperature: { port: output, quantity: temperature, unit: "°C" }
    signals:
      temperature: { range: [0, 120], precision: 2 }
  heater:
    driver: sim_drive
    label: Oven heater
    config:
      link: chamber
      ports:
        drive: { port: input, demand: output, quantity: temperature, unit: "°C" }
  dual_level:
    driver: sim_daq
    label: Tank level
    poll_s: 0.5
    config:
      link: tank
      ports:
        volume: { port: output, quantity: volume, unit: L }
    signals:
      volume: { range: [0, 100], precision: 1 }
  valve:
    driver: sim_drive
    label: Inlet valve
    config:
      link: tank
      ports:
        drive: { port: input, demand: output, quantity: volume, unit: L, limits: [0, 40] }

# Each drive takes its demand straight in the plant's output unit -- see
# oven.yaml and tank.yaml -- so the law gains are the old per-unit tunings.
controllers:
  heater.drive:
    measured: dual_temp.temperature
    law: { tag: PI, kp: 0.02, ki: 0.0005 }
    default: true
  valve.drive:
    measured: dual_level.volume
    law: { tag: PI, kp: 0.05, ki: 0.01 }
