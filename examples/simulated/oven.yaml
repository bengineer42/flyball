# yaml-language-server: $schema=rig.schema.json
# A heated oven: a first-order lag with dead time, the plant every autotuner
# is designed for. Nothing here is Python; `flyball-daemon oven.yaml`
# runs it, and every route, the CLI and the schema work on it as on hardware.

name: oven

links:
  chamber:
    tag: sim_plant
    model: fopdt
    tau_s: 60.0        # the oven takes about a minute to respond
    dead_s: 5.0        # ... and five seconds before it starts to
    gain: 80.0         # full heater power (input 1.0) adds 80 °C over ambient
    ambient: 20.0      # the room; where it rests with the heater off
    initial: 20.0      # starts at room temperature
    noise: 0.05        # the thermocouple's noise, in °C
    seed: 1

devices:
  thermocouple:
    driver: sim_daq
    label: Oven thermocouple
    poll_s: 1.0
    config:
      link: chamber
      ports:
        temperature: { port: output, quantity: temperature, unit: "°C" }
    signals:
      temperature:
        range: [0, 120]
        precision: 2
        warn: [30, 90]     # outside: a warning (EPICS LOW/HIGH)
        alarm: [10, 110]   # outside: an alarm (EPICS LOLO/HIHI)
  heater:
    driver: sim_drive
    label: Oven heater
    config: { link: chamber, ports: { drive: input } }   # heater.drive [W], 0 to 1 of full

# The drive is a bare fraction of full, so the feedforward is the plant's
# static inverse -- (setpoint - ambient) / gain -- and the law's gains are
# per °C of error in that unit: the old °C-per-°C tuning (0.02, 0.0005)
# over the plant's gain of 80.
controllers:
  heater.drive:
    signal: thermocouple.temperature
    feedforward: { tag: affine, gain: 0.0125, bias: -0.25 }
    law: { tag: PI, kp: 0.00025, ki: 0.00000625 }
    default: true
