# yaml-language-server: $schema=rig.schema.json
# A heated oven: a first-order lag with dead time, the plant every autotuner
# is designed for. Nothing here is Python; `flyball-runner oven.yaml`
# runs it, and every route, the CLI and the schema work on it as on hardware.

name: oven

links:
  chamber:
    type: sim_plant
    model: fopdt
    tau_s: 60.0        # the oven takes about a minute to respond
    dead_s: 5.0        # ... and five seconds before it starts to
    gain: 80.0         # full heater power (input 1.0) adds 80 °C over ambient
    ambient: 20.0      # the room; where it rests with the heater off
    initial: 20.0      # starts at room temperature
    noise: 0.05        # the thermocouple's noise, in °C
    seed: 1

devices:
  thermocouple:
    driver: sim_daq
    label: Oven thermocouple
    poll_s: 1.0
    config:
      link: chamber
      ports:
        temperature: { port: output, quantity: temperature, unit: "°C" }
    signals:
      temperature:
        range: [0, 120]
        precision: 2
        warning: [30, 90]     # outside: a warning (EPICS LOW/HIGH)
        alarm: [10, 110]   # outside: an alarm (EPICS LOLO/HIHI)
  heater:
    driver: sim_drive
    label: Oven heater
    # heater.drive [W] °C, smart: a demand is the temperature to hold, and
    # commit() inverts the plant to find the drive; `limits` defaults to the
    # plant's own static range (20..100 °C, ambient to ambient + gain).
    config:
      link: chamber
      ports:
        drive: { port: input, demand: output, quantity: temperature, unit: "°C" }

# The drive takes a demand straight in °C, so the controller hands it the
# setpoint untouched (the default `setpoint` feedforward, since the units
# agree) and the law's gains are the old °C-per-°C tuning.
controllers:
  heater.drive:
    measured: thermocouple.temperature
    law: { type: PI, kp: 0.02, ki: 0.0005 }
    default: true
