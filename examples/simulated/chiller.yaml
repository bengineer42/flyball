# yaml-language-server: $schema=rig.schema.json
# A reverse-acting loop: the actuator *cools*. A `sim_plant` lag with a
# negative `gain` rests at `ambient` with the compressor off and falls
# below it as the compressor drives harder. The drive is declared
# `demand: output`, so a demand is the temperature to hold and `commit()`
# inverts the plant -- `(demand - ambient) / gain`, negative for a negative
# gain -- which is why nothing here needs to know the compressor cools
# rather than heats: the law's gains are ordinary positive PI.

name: chiller

links:
  bath:
    tag: sim_plant
    model: lag
    tau_s: 45.0
    gain: -30.0        # full compressor pulls 30 °C below ambient
    ambient: 22.0      # the room; where it rests with the compressor off
    initial: 22.0
    noise: 0.05
    seed: 3

devices:
  probe:
    driver: sim_daq
    label: Bath probe
    poll_s: 1.0
    config:
      link: bath
      ports:
        temperature: { port: output, quantity: temperature, unit: "°C" }
    signals:
      temperature:
        range: [-20, 40]
        precision: 2
        warn: [0, 30]
        alarm: [-10, 35]
  compressor:
    driver: sim_drive
    label: Chiller compressor
    # compressor.drive [W] °C, smart: `limits` defaults to the plant's own
    # static range, -8..22 °C (ambient + gain to ambient, sorted rising).
    config:
      link: bath
      ports:
        drive: { port: input, demand: output, quantity: temperature, unit: "°C" }

# The old °C-per-°C tuning: positive, since the plant's negative gain does
# the inverting.
controllers:
  compressor.drive:
    measured: probe.temperature
    law: { tag: PI, kp: 0.05, ki: 0.0015 }
    default: true
