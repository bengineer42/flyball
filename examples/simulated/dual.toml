#:schema rig.schema.json
# Two independent loops of different units in one rig: an oven (°C) and a
# tank (L), sharing nothing but the process. Nothing here says a rig file
# is one plant -- `loops` just lists them, and each names its own channel
# and actuator.

name = "dual"

[links.chamber]
tag = "sim_plant"
kind = "fopdt"
tau_s = 60.0
dead_s = 5.0
gain = 80.0
ambient = 20.0
initial = 20.0
noise = 0.05
seed = 1

[[readers]]
period_s = 1.0
[readers.device]
tag = "sim_reader"
name = "dual_temp"
label = "Oven thermocouple"
link = "chamber"
measurand = "temperature"
unit = "°C"
range = [0, 120]
precision = 2

[[actuators]]
tag = "sim_actuator"
name = "heater"
label = "Oven heater"
link = "chamber"
limits = [0.0, 1.0]

[[loops]]
channel = "dual_temp.temperature"
actuator = "heater"
law = { tag = "PI", kp = 0.02, ki = 0.0005 }
default = true

[links.tank]
tag = "sim_plant"
kind = "integrator"
gain = 2.0
leak = 0.05
initial = 10.0
noise = 0.02

[[readers]]
period_s = 0.5
[readers.device]
tag = "sim_reader"
name = "dual_level"
label = "Tank level"
link = "tank"
measurand = "volume"
unit = "L"
range = [0, 100]
precision = 1

[[actuators]]
tag = "sim_actuator"
name = "valve"
label = "Inlet valve"
link = "tank"
limits = [0.0, 1.0]

[[loops]]
channel = "dual_level.volume"
actuator = "valve"
law = { tag = "PI", kp = 0.05, ki = 0.01 }
