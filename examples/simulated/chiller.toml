#:schema rig.schema.json
# A reverse-acting loop: the actuator *cools*. A `sim_plant lag` with a
# negative `gain` rests at `ambient` with the compressor off and falls
# below it as the compressor drives harder -- `SimActuator`'s smart mode
# inverts whatever sign the plant's feedforward has, so the loop and the
# actuator need nothing special to know the actuator cools rather than
# heats; only the plant's `gain` is negative. The alternative the code also
# supports -- `limits = [-1, 0]` on a positive-gain plant, so a negative
# drive is "cooling" -- reads backwards on a gauge and on `disturb`, so this
# file uses the negative gain instead.

name = "chiller"

[links.bath]
tag = "sim_plant"
kind = "lag"
tau_s = 45.0
gain = -30.0        # full compressor pulls 30 °C below ambient
ambient = 22.0      # the room; where it rests with the compressor off
initial = 22.0
noise = 0.05
seed = 3

[[readers]]
period_s = 1.0
[readers.device]
tag = "sim_reader"
name = "probe"
label = "Bath probe"
link = "bath"
measurand = "temperature"
unit = "°C"
range = [-20, 40]
precision = 2
warn = [0, 30]
alarm = [-10, 35]

[[actuators]]
tag = "sim_actuator"
name = "compressor"
label = "Chiller compressor"
link = "bath"
limits = [0.0, 1.0]

[[loops]]
channel = "probe.temperature"
actuator = "compressor"
law = { tag = "PI", kp = 0.05, ki = 0.0015 }
default = true
