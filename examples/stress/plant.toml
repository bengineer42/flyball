gain = 100.0
ambient = 5.0
initial = 5.0
noise = 0.3

[[readers]]
period_s = 5.0
[readers.device]
tag = "sim_reader"
name = "mass"
label = "Spare: mass"
link = "hopper"
measurand = "mass"
unit = "kg"
range = [0, 200]
precision = 2

[links.rail]
tag = "sim_plant"
kind = "lag"
tau_s = 4.0
gain = 1.0
ambient = 0.0
initial = 0.0
noise = 0.01

[[readers]]
period_s = 0.2
[readers.device]
tag = "sim_reader"
name = "length"
label = "Spare: length"
link = "rail"
measurand = "length"
unit = "m"
range = [-1, 1]
precision = 4

[links.cell]
tag = "sim_plant"
kind = "lag"
tau_s = 6.0
gain = 500.0
ambient = 0.0
initial = 0.0
noise = 2.0

[[readers]]
period_s = 0.5
[readers.device]
tag = "sim_reader"
name = "energy"
label = "Spare: energy"
link = "cell"
measurand = "energy"
