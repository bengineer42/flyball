#:schema ../simulated/rig.schema.json
# "The works": everything the simulated devices can do, in one rig. A
# 12-zone furnace (varied per-zone power and mass, sampled in zone 6), three
# fopdt ovens with different time constants and dead times, two integrating
# tanks, one lone pressure lag, a three-instrument fake SCPI bench, and a
# Modbus register table over `fake_registers` -- all in one process, all
# polled, most of it looped. Twelve zones + three ovens + two tanks get a
# loop each (17), mixing P/PI/PID and every feedforward kind; three
# actuators (the bench PSU, the vessel vent, the spare shaker) carry no
# loop at all. Reader periods are spread 0.2/0.5/1/2/5 s on purpose, and a
# few bands are set so the rig starts already showing a warning and an
# alarm.
#
# The zone gains and the `table` feedforward's points are illustrative, not
# individually tuned per zone -- the point of this file is scale and
# variety, not a textbook furnace. See `../stress/README.md` for what to run
# on it and the measured numbers.
#
#   flyball-daemon plant.toml
#   flyball program run ../programs/plant-firing.yaml

name = "plant"
clock = { speed = 60 }

# ---------------------------------------------------------------- furnace --
[links.tube]
tag = "sim_furnace"
zones = 12
power_w = [1000, 1500, 2000, 2500, 3000, 6000, 3000, 2500, 2000, 1500, 1200, 900]
capacity_j_per_k = [2000, 2200, 2500, 2800, 3000, 3500, 3000, 2800, 2500, 2200, 2000, 1800]
coupling_w_per_k = 6.0
loss_w_per_k = 1.8
emissivity = 0.75
area_m2 = 0.012
ambient_c = 20.0
sample_zone = 6
sample_capacity_j_per_k = 700
sample_coupling_w_per_k = 3.5
sensor_lag_s = 2.5
noise = 0.2
seed = 42

[[readers]]
period_s = 0.2
[readers.device]
tag = "sim_reader"
name = "zone1"
label = "Zone 1"
link = "tube"
port = "zone1"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1
# `Measurand` is interned by name across the whole rig (and process): the
# first reader to declare "temperature" fixes range/precision/warn/alarm for
# every "temperature" channel here, oven thermocouples included. This band
# puts every zone and oven -- all starting near the 20 °C ambient -- into
# warn at start-up.
warn = [25, 1300]           # starts in warn: ambient (20) is below 25

[[readers]]
period_s = 0.5
[readers.device]
tag = "sim_reader"
name = "zone2"
label = "Zone 2"
link = "tube"
port = "zone2"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 1.0
[readers.device]
tag = "sim_reader"
name = "zone3"
label = "Zone 3"
link = "tube"
port = "zone3"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 2.0
[readers.device]
tag = "sim_reader"
name = "zone4"
label = "Zone 4"
link = "tube"
port = "zone4"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 5.0
[readers.device]
tag = "sim_reader"
name = "zone5"
label = "Zone 5"
link = "tube"
port = "zone5"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 0.2
[readers.device]
tag = "sim_reader"
name = "zone6"
label = "Zone 6 (sample, hot)"
link = "tube"
port = "zone6"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 0.5
[readers.device]
tag = "sim_reader"
name = "zone7"
label = "Zone 7"
link = "tube"
port = "zone7"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 1.0
[readers.device]
tag = "sim_reader"
name = "zone8"
label = "Zone 8"
link = "tube"
port = "zone8"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 2.0
[readers.device]
tag = "sim_reader"
name = "zone9"
label = "Zone 9"
link = "tube"
port = "zone9"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 5.0
[readers.device]
tag = "sim_reader"
name = "zone10"
label = "Zone 10"
link = "tube"
port = "zone10"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 0.2
[readers.device]
tag = "sim_reader"
name = "zone11"
label = "Zone 11"
link = "tube"
port = "zone11"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
precision = 1

[[readers]]
period_s = 0.5
[readers.device]
tag = "sim_reader"
name = "zone12"
label = "Zone 12"
link = "tube"
port = "zone12"
measurand = "temperature"
unit = "°C"
range = [0, 1300]
