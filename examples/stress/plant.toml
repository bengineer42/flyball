[[actuators]]
tag = "sim_actuator"
name = "heater1"
label = "Zone 1 heater"
link = "tube"
port = "heater1"
unit = "W"
power_w = 1000

[[actuators]]
tag = "sim_actuator"
name = "heater2"
label = "Zone 2 heater"
link = "tube"
port = "heater2"
unit = "W"
power_w = 1500

[[actuators]]
tag = "sim_actuator"
name = "heater3"
label = "Zone 3 heater"
link = "tube"
port = "heater3"
unit = "W"
power_w = 2000

[[actuators]]
tag = "sim_actuator"
name = "heater4"
label = "Zone 4 heater"
link = "tube"
port = "heater4"
unit = "W"
power_w = 2500

[[actuators]]
tag = "sim_actuator"
name = "heater5"
label = "Zone 5 heater"
link = "tube"
port = "heater5"
unit = "W"
power_w = 3000

[[actuators]]
tag = "sim_actuator"
name = "heater6"
label = "Zone 6 heater"
link = "tube"
port = "heater6"
unit = "W"
power_w = 6000

[[actuators]]
tag = "sim_actuator"
name = "heater7"
label = "Zone 7 heater"
link = "tube"
port = "heater7"
unit = "W"
power_w = 3000

[[actuators]]
tag = "sim_actuator"
name = "heater8"
label = "Zone 8 heater"
link = "tube"
port = "heater8"
unit = "W"
power_w = 2500

[[actuators]]
tag = "sim_actuator"
name = "heater9"
label = "Zone 9 heater"
link = "tube"
port = "heater9"
unit = "W"
power_w = 2000

[[actuators]]
tag = "sim_actuator"
name = "heater10"
label = "Zone 10 heater"
link = "tube"
port = "heater10"
unit = "W"
power_w = 1500

[[actuators]]
tag = "sim_actuator"
name = "heater11"
label = "Zone 11 heater"
link = "tube"
port = "heater11"
unit = "W"
power_w = 1200

[[actuators]]
tag = "sim_actuator"
name = "heater12"
label = "Zone 12 heater"
link = "tube"
port = "heater12"
unit = "W"
power_w = 900

[[loops]]
channel = "zone1.temperature"
actuator = "heater1"
law = { tag = "PI", kp = 100, ki = 0.15, tt = 30 }
feedforward = { tag = "none" }

[[loops]]
channel = "zone2.temperature"
actuator = "heater2"
law = { tag = "PID", kp = 100, ki = 0.1, kd = 20, tt = 30 }
feedforward = { tag = "affine", gain = 2.0, bias = 50 }

[[loops]]
channel = "zone3.temperature"
actuator = "heater3"
law = { tag = "P", kp = 120 }
feedforward = { tag = "table", points = [[20, 0], [200, 289], [400, 660], [600, 1200], [800, 2000], [1000, 2800]] }

[[loops]]
channel = "zone4.temperature"
actuator = "heater4"
law = { tag = "PI", kp = 100, ki = 0.15, tt = 30 }
feedforward = { tag = "none" }

[[loops]]
channel = "zone5.temperature"
actuator = "heater5"
law = { tag = "PID", kp = 100, ki = 0.1, kd = 20, tt = 30 }
feedforward = { tag = "affine", gain = 2.0, bias = 80 }

[[loops]]
channel = "zone6.temperature"
actuator = "heater6"
law = { tag = "PI", kp = 100, ki = 0.15, tt = 30 }
feedforward = { tag = "table", points = [[20, 0], [200, 289], [400, 660], [600, 1200], [800, 2000], [1000, 2800]] }
default = true

[[loops]]
channel = "zone7.temperature"
actuator = "heater7"
law = { tag = "P", kp = 120 }
feedforward = { tag = "none" }

[[loops]]
channel = "zone8.temperature"
actuator = "heater8"
law = { tag = "PI", kp = 100, ki = 0.15, tt = 30 }
feedforward = { tag = "affine", gain = 1.8, bias = 60 }

[[loops]]
channel = "zone9.temperature"
actuator = "heater9"
law = { tag = "PID", kp = 100, ki = 0.1, kd = 20, tt = 30 }
feedforward = { tag = "table", points = [[20, 0], [200, 289], [400, 660], [600, 1200], [800, 2000], [1000, 2800]] }

[[loops]]
channel = "zone10.temperature"
actuator = "heater10"
law = { tag = "P", kp = 120 }
feedforward = { tag = "none" }

[[loops]]
channel = "zone11.temperature"
actuator = "heater11"
law = { tag = "PI", kp = 100, ki = 0.15, tt = 30 }
feedforward = { tag = "affine", gain = 1.5, bias = 40 }

[[loops]]
channel = "zone12.temperature"
actuator = "heater12"
law = { tag = "PID", kp = 100, ki = 0.1, kd = 20, tt = 30 }
feedforward = { tag = "table", points = [[20, 0], [200, 289], [400, 660], [600, 1200], [800, 2000], [1000, 2800]] }

# ------------------------------------------------------------------ ovens --
[links.oven1]
tag = "sim_plant"
kind = "fopdt"
tau_s = 30.0
dead_s = 2.0
gain = 60.0
ambient = 20.0
initial = 20.0
noise = 0.05
seed = 11

[links.oven2]
tag = "sim_plant"
kind = "fopdt"
tau_s = 90.0
dead_s = 8.0
gain = 100.0
ambient = 20.0
initial = 20.0
noise = 0.08
seed = 12

[links.oven3]
tag = "sim_plant"
kind = "fopdt"
tau_s = 200.0
dead_s = 20.0
gain = 150.0
ambient = 20.0
initial = 20.0
noise = 0.1
seed = 13

[[readers]]
period_s = 0.2
[readers.device]
tag = "sim_reader"
name = "temp1"
label = "Oven 1 thermocouple"
link = "oven1"
measurand = "temperature"
unit = "°C"
range = [0, 250]
precision = 2

[[readers]]
period_s = 1.0
[readers.device]
tag = "sim_reader"
name = "temp2"
label = "Oven 2 thermocouple"
link = "oven2"
measurand = "temperature"
unit = "°C"
range = [0, 250]
precision = 2

[[readers]]
period_s = 5.0
[readers.device]
tag = "sim_reader"
name = "temp3"
label = "Oven 3 thermocouple"
link = "oven3"
measurand = "temperature"
unit = "°C"
range = [0, 250]
precision = 2

[[actuators]]
tag = "sim_actuator"
name = "burner1"
label = "Oven 1 heater"
link = "oven1"
limits = [0.0, 1.0]

[[actuators]]
tag = "sim_actuator"
name = "burner2"
label = "Oven 2 heater"
link = "oven2"
limits = [0.0, 1.0]

[[actuators]]
tag = "sim_actuator"
name = "burner3"
label = "Oven 3 heater"
link = "oven3"
limits = [0.0, 1.0]

[[loops]]
channel = "temp1.temperature"
actuator = "burner1"
law = { tag = "P", kp = 0.027 }

[[loops]]
channel = "temp2.temperature"
actuator = "burner2"
law = { tag = "PI", kp = 0.016, ki = 0.0006 }

[[loops]]
channel = "temp3.temperature"
actuator = "burner3"
law = { tag = "PID", kp = 0.0107, ki = 0.0004, kd = 1.0 }

# ------------------------------------------------------------------ tanks --
[links.tank1]
tag = "sim_plant"
kind = "integrator"
gain = 2.0
leak = 0.05
initial = 12.0
noise = 0.02

[links.tank2]
tag = "sim_plant"
kind = "integrator"
gain = 3.0
leak = 0.08
initial = 30.0
noise = 0.03

[[readers]]
period_s = 0.5
[readers.device]
tag = "sim_reader"
name = "level1"
label = "Tank 1 level"
link = "tank1"
measurand = "volume"
unit = "L"
range = [0, 100]
precision = 1
warn = [15, 100]             # starts in warn: 12 L is below 15

[[readers]]
period_s = 2.0
[readers.device]
tag = "sim_reader"
name = "level2"
label = "Tank 2 level"
link = "tank2"
measurand = "volume"
unit = "L"
range = [0, 100]
precision = 1

[[actuators]]
tag = "sim_actuator"
name = "valve1"
label = "Tank 1 inlet valve"
link = "tank1"
limits = [0.0, 1.0]

[[actuators]]
tag = "sim_actuator"
name = "valve2"
label = "Tank 2 inlet valve"
link = "tank2"
limits = [0.0, 1.0]

[[loops]]
channel = "level1.volume"
actuator = "valve1"
law = { tag = "PI", kp = 0.05, ki = 0.01 }

[[loops]]
channel = "level2.volume"
actuator = "valve2"
law = { tag = "PID", kp = 0.04, ki = 0.008, kd = 0.2 }

# ------------------------------------------------------------ pressure vessel --
[links.vessel]
tag = "sim_plant"
kind = "lag"
tau_s = 15.0
gain = 250.0
ambient = 100.0
initial = 100.0
noise = 1.0
seed = 21

[[readers]]
period_s = 1.0
[readers.device]
tag = "sim_reader"
name = "pressure"
label = "Vessel pressure"
link = "vessel"
measurand = "pressure"
unit = "kPa"
range = [0, 500]
precision = 1
warn = [110, 600]            # starts in warn: 100 kPa is below 110
alarm = [105, 600]           # starts in alarm too: 100 kPa is below 105

# vent is a plain drive actuator: no loop, a manual/simulation-only knob.
[[actuators]]
tag = "sim_actuator"
name = "vent"
label = "Vessel vent"
link = "vessel"
limits = [0.0, 1.0]

# -------------------------------------------------------------- SCPI bench --
# Three fake instruments over `fake_text`: a PSU (actuator only, no loop), a
# DMM (voltage + current) and a frequency counter (frequency + duty).
[links.psu]
tag = "fake_text"
replies = { "MEAS:VOLT?" = "230.000", "*IDN?" = "Fake Instruments,PSU-2,0,1.0" }

[links.dmm]
tag = "fake_text"
replies = { "MEAS:VOLT:DC?" = "+2.3000E+02", "MEAS:CURR:DC?" = "1.250", "*IDN?" = "Fake Instruments,DMM-2,0,1.0" }

[links.freqctr]
tag = "fake_text"
replies = { "MEAS:FREQ?" = "1000.0", "MEAS:DUTY?" = "45.0", "*IDN?" = "Fake Instruments,FC-1,0,1.0" }

[[actuators]]
tag = "scpi_actuator"
name = "psu"
label = "Bench PSU"
link = "psu"
command = "SOUR:VOLT {value:.3f}"
demand_unit = "V"
readback = "MEAS:VOLT?"

[[readers]]
period_s = 0.5
[readers.device]
tag = "scpi_reader"
name = "bench_dmm"
label = "Bench DMM"
link = "dmm"
[readers.device.measurands.voltage]
query = "MEAS:VOLT:DC?"
unit = "V"
range = [0, 300]
precision = 3
[readers.device.measurands.current]
query = "MEAS:CURR:DC?"
unit = "A"
range = [0, 5]
precision = 3

[[readers]]
period_s = 1.0
[readers.device]
tag = "scpi_reader"
name = "freqctr"
label = "Bench frequency counter"
link = "freqctr"
[readers.device.measurands.frequency]
query = "MEAS:FREQ?"
unit = "Hz"
range = [0, 100000]
precision = 1
[readers.device.measurands.duty]
query = "MEAS:DUTY?"
unit = "%"
range = [0, 100]
precision = 1

# --------------------------------------------------------- Modbus register bank --
[links.plc]
tag = "fake_registers"
registers = { 0 = 1013, 1 = 250, 2 = 6500, 3 = 1450, 4 = 3200, 5 = 1250 }

[[readers]]
period_s = 2.0
[readers.device]
tag = "modbus_reader"
name = "plc"
label = "PLC registers"
link = "plc"
[readers.device.registers.pressure2]
address = 0
scale = 0.1
unit = "kPa"
range = [0, 500]
precision = 1
[readers.device.registers.flow]
address = 1
scale = 0.1
unit = "L/min"
range = [0, 100]
precision = 1
[readers.device.registers.tank_pct]
address = 2
scale = 0.01
unit = "%"
range = [0, 100]
precision = 2
[readers.device.registers.motor_speed]
address = 3
scale = 1.0
unit = "1/min"
range = [0, 3000]
precision = 0
[readers.device.registers.power]
address = 4
scale = 1.0
unit = "W"
range = [0, 10000]
precision = 0
[readers.device.registers.current2]
address = 5
scale = 0.01
unit = "A"
range = [0, 50]
precision = 2

# --------------------------------------------------------------- spares --
# Padding channels: one per plant, mostly units nothing else in this file
# uses, so the total clears 40 channels across a wide spread of dimensions.
# `shaker` also carries the third no-loop actuator.
[links.shaker]
tag = "sim_plant"
kind = "lag"
tau_s = 2.0
gain = 0.5
ambient = 0.0
initial = 0.0
noise = 0.01

[[readers]]
period_s = 0.2
[readers.device]
tag = "sim_reader"
name = "vibration"
label = "Shaker table"
link = "shaker"
measurand = "speed"
unit = "m/s"
range = [0, 2]
precision = 3

[[actuators]]
tag = "sim_actuator"
name = "shaker_drive"
label = "Shaker drive"
link = "shaker"
limits = [0.0, 1.0]

[links.humidity_cell]
tag = "sim_plant"
kind = "lag"
tau_s = 20.0
gain = 40.0
ambient = 40.0
initial = 40.0
noise = 0.5

[[readers]]
period_s = 0.5
[readers.device]
tag = "sim_reader"
name = "humidity"
label = "Spare: humidity"
link = "humidity_cell"
measurand = "humidity"
unit = "%"
range = [0, 100]
precision = 1

[links.tach]
tag = "sim_plant"
kind = "lag"
tau_s = 3.0
gain = 50.0
ambient = 5.0
initial = 5.0
noise = 0.2

[[readers]]
period_s = 1.0
[readers.device]
tag = "sim_reader"
name = "count_rate"
label = "Spare: count rate"
link = "tach"
measurand = "frequency"
unit = "Hz"
range = [0, 100]
precision = 1

[links.wrench]
tag = "sim_plant"
kind = "lag"
tau_s = 5.0
gain = 10.0
ambient = 0.0
initial = 0.0
noise = 0.05

[[readers]]
period_s = 2.0
[readers.device]
tag = "sim_reader"
name = "torque"
label = "Spare: torque"
link = "wrench"
measurand = "torque"
unit = "N·m"
range = [-20, 20]
precision = 2

[links.hopper]
tag = "sim_plant"
kind = "lag"
