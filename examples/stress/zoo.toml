#:schema ../simulated/rig.schema.json
# One channel per unit the units registry knows how to display, so every
# gauge kind and one unit-chart per unit gets exercised: temperatures on two
# different scales, a percentage, volumes, electrical units, pressure in two
# different prefixes of the same unit, a frequency, a speed, a mass, a
# length, a bare drive fraction, resistance, energy, charge, an amount of
# substance, an angle, a volume flow and a rotational rate. Most are a lag
# with nothing driving it (a gauge with a value and a band); four have a
# loop, so the UI's "has a loop" and "does not" both show up per unit.

name = "zoo"

# ------------------------------------------------------- temperature: °C --
[links.celsius_cell]
tag = "sim_plant"
kind = "lag"
tau_s = 5.0
gain = 1.0
ambient = 20.0
initial = 20.0
noise = 0.2

[[readers]]
period_s = 1.0
[readers.device]
tag = "sim_reader"
name = "celsius"
label = "Temperature (°C)"
link = "celsius_cell"
measurand = "zoo_celsius"
unit = "°C"
range = [-20, 150]
precision = 1
warn = [0, 100]
alarm = [-10, 120]

[[actuators]]
tag = "sim_actuator"
name = "celsius_drive"
label = "Temperature drive"
link = "celsius_cell"
limits = [0.0, 1.0]

[[loops]]
channel = "celsius.zoo_celsius"
actuator = "celsius_drive"
law = { tag = "PI", kp = 0.05, ki = 0.002 }
default = true

