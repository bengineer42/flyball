# yaml-language-server: $schema=program.schema.json
# Exercise the four controllers `zoo.yaml` has (the rest are gauges with
# nothing driving them), one after another, so every controller mode shows
# up at least once: regulating, holding, manual.
name: zoo-tour
description: Step each of the four controlled channels through a small setpoint change.
steps:
  - regulate: { loop: celsius_heater.drive, setpoint: 35 }
  - regulate: { loop: voltage_source.drive, setpoint: 18 }
  - regulate: { loop: length_motor.drive, setpoint: 3 }
  - regulate: { loop: flow_pump.drive, setpoint: 20 }
  - hold: { minutes: 2, message: "all four controllers regulating" }
  - manual: [celsius_heater.drive, voltage_source.drive, length_motor.drive, flow_pump.drive]
