# yaml-language-server: $schema=program.schema.json
# Nothing to regulate here really -- `torrent.yaml` exists to be polled fast
# -- but one controller is under load too, so hold it at a setpoint while the
# rest of the rig fires samples as fast as it can.
name: torrent-soak
description: Hold channel 1's controller at a setpoint while every channel free-runs.
steps:
  - regulate: { loop: drive1.drive, setpoint: 2 }
  - wait: { duration: { minutes: 2 }, message: "under load" }
  - manual: [drive1.drive]
