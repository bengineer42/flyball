# yaml-language-server: $schema=../simulated/rig.schema.json
# "The works": everything the simulated devices can do, in one rig. A
# 12-zone furnace (varied per-zone power and mass, sampled in zone 6), three
# fopdt ovens with different time constants and dead times, two integrating
# tanks, one lone pressure lag, a three-instrument fake SCPI bench, and a
# Modbus register table over `fake_registers` -- all in one process, all
# polled, most of it under a controller. Twelve zones + three ovens + two
# tanks get a controller each (17), mixing P/PI/PID and every feedforward
# kind; three writable devices (the bench PSU, the vessel vent, the spare
# shaker) carry no controller at all. Poll periods are spread 0.2/0.5/1/2/5 s
# on purpose, and a few bands are set so the rig starts already showing a
# warning and an alarm.
#
# The zone gains and the `table` feedforward's points are illustrative, not
# individually tuned per zone -- the point of this file is scale and
# variety, not a textbook furnace. See `../stress/README.md` for what to run
# on it and the measured numbers.
#
#   flyball-runner plant.yaml
#   flyball program run ../programs/plant-firing.yaml

name: plant
clock: { speed: 60 }

links:
  tube:
    tag: sim_furnace
    zones: 12
    power_w: [1000, 1500, 2000, 2500, 3000, 6000, 3000, 2500, 2000, 1500, 1200, 900]
    capacity_j_per_k: [2000, 2200, 2500, 2800, 3000, 3500, 3000, 2800, 2500, 2200, 2000, 1800]
    coupling_w_per_k: 6.0
    loss_w_per_k: 1.8
    emissivity: 0.75
    area_m2: 0.012
    ambient_c: 20.0
    sample_zone: 6
    sample_capacity_j_per_k: 700
    sample_coupling_w_per_k: 3.5
    sensor_lag_s: 2.5
    noise: 0.2
    seed: 42
  oven1:
    tag: sim_plant
    model: fopdt
    tau_s: 30.0
    dead_s: 2.0
    gain: 60.0
    ambient: 20.0
    initial: 20.0
    noise: 0.05
    seed: 11
  oven2:
    tag: sim_plant
    model: fopdt
    tau_s: 90.0
    dead_s: 8.0
    gain: 100.0
    ambient: 20.0
    initial: 20.0
    noise: 0.08
    seed: 12
  oven3:
    tag: sim_plant
    model: fopdt
    tau_s: 200.0
    dead_s: 20.0
    gain: 150.0
    ambient: 20.0
    initial: 20.0
    noise: 0.1
    seed: 13
  tank1:
    tag: sim_plant
    model: integrator
    gain: 2.0
    leak: 0.05
    initial: 12.0
    noise: 0.02
  tank2:
    tag: sim_plant
    model: integrator
    gain: 3.0
    leak: 0.08
    initial: 30.0
    noise: 0.03
  vessel:
    tag: sim_plant
    model: lag
    tau_s: 15.0
    gain: 250.0
    ambient: 100.0
    initial: 100.0
    noise: 1.0
    seed: 21
  psu:
    tag: fake_text
    replies: { "MEAS:VOLT?": "230.000", "*IDN?": "Fake Instruments,PSU-2,0,1.0" }
  dmm:
    tag: fake_text
    replies: { "MEAS:VOLT:DC?": "+2.3000E+02", "MEAS:CURR:DC?": "1.250", "*IDN?": "Fake Instruments,DMM-2,0,1.0" }
  freqctr:
    tag: fake_text
    replies: { "MEAS:FREQ?": "1000.0", "MEAS:DUTY?": "45.0", "*IDN?": "Fake Instruments,FC-1,0,1.0" }
  plc:
    tag: fake_registers
    registers: { "0": 1013, "1": 250, "2": 6500, "3": 1450, "4": 3200, "5": 1250 }
  shaker:
    tag: sim_plant
    model: lag
    tau_s: 2.0
    gain: 0.5
    ambient: 0.0
    initial: 0.0
    noise: 0.01
  humidity_cell:
    tag: sim_plant
    model: lag
    tau_s: 20.0
    gain: 40.0
    ambient: 40.0
    initial: 40.0
    noise: 0.5
  tach:
    tag: sim_plant
    model: lag
    tau_s: 3.0
    gain: 50.0
    ambient: 5.0
    initial: 5.0
    noise: 0.2
  wrench:
    tag: sim_plant
    model: lag
    tau_s: 5.0
    gain: 10.0
    ambient: 0.0
    initial: 0.0
    noise: 0.05
  hopper:
    tag: sim_plant
    model: lag
    tau_s: 8.0
    gain: 100.0
    ambient: 5.0
    initial: 5.0
    noise: 0.3
  rail:
    tag: sim_plant
    model: lag
    tau_s: 4.0
    gain: 1.0
    ambient: 0.0
    initial: 0.0
    noise: 0.01
  cell:
    tag: sim_plant
    model: lag
    tau_s: 6.0
    gain: 500.0
    ambient: 0.0
    initial: 0.0
    noise: 2.0
  capacitor:
    tag: sim_plant
    model: lag
    tau_s: 1.0
    gain: 0.1
    ambient: 0.0
    initial: 0.0
    noise: 0.005
  reactor:
    tag: sim_plant
    model: lag
    tau_s: 12.0
    gain: 5.0
    ambient: 1.0
    initial: 1.0
    noise: 0.02
  knob:
    tag: sim_plant
    model: lag
    tau_s: 1.0
    gain: 1.0
    ambient: 0.3
    initial: 0.3
    noise: 0.005
  silo:
    tag: sim_plant
    model: lag
    tau_s: 10.0
    gain: 2.0
    ambient: 0.5
    initial: 0.5
    noise: 0.01
  turntable:
    tag: sim_plant
    model: lag
    tau_s: 3.0
    gain: 3.0
    ambient: 0.0
    initial: 0.0
    noise: 0.01

devices:
  temp1:
    driver: sim_daq
    label: Oven 1 thermocouple
    poll_s: 0.2
    config:
      link: oven1
      ports:
        temperature: { port: output, quantity: temperature, unit: "°C" }
    signals:
      temperature: { range: [0, 250], precision: 2 }
  temp2:
    driver: sim_daq
    label: Oven 2 thermocouple
    poll_s: 1.0
    config:
      link: oven2
      ports:
        temperature: { port: output, quantity: temperature, unit: "°C" }
    signals:
      temperature: { range: [0, 250], precision: 2 }
  temp3:
    driver: sim_daq
    label: Oven 3 thermocouple
    poll_s: 5.0
    config:
      link: oven3
      ports:
        temperature: { port: output, quantity: temperature, unit: "°C" }
    signals:
      temperature: { range: [0, 250], precision: 2 }
  level1:
    driver: sim_daq
    label: Tank 1 level
    poll_s: 0.5
    config:
      link: tank1
      ports:
        volume: { port: output, quantity: volume, unit: L }
    signals:
      volume: { range: [0, 100], precision: 1, warn: [15, 100] }   # starts in warn: 12 L is below 15
  level2:
    driver: sim_daq
    label: Tank 2 level
    poll_s: 2.0
    config:
      link: tank2
      ports:
        volume: { port: output, quantity: volume, unit: L }
    signals:
      volume: { range: [0, 100], precision: 1 }
  pressure:
    driver: sim_daq
    label: Vessel pressure
    poll_s: 1.0
    config:
      link: vessel
      ports:
        pressure: { port: output, quantity: pressure, unit: kPa }
    signals:
      pressure: { range: [0, 500], precision: 1, warn: [110, 600], alarm: [105, 600] }
  # ------------------------------------------------------------ SCPI bench --
  # Three fake instruments over `fake_text`: a PSU (writable, no controller),
  # a DMM (voltage + current) and a frequency counter (frequency + duty).
  bench_dmm:
    driver: scpi
    label: Bench DMM
    poll_s: 0.5
    config:
      link: dmm
      channels:
        voltage: { query: "MEAS:VOLT:DC?", unit: V }
        current: { query: "MEAS:CURR:DC?", unit: A }
    signals:
      voltage: { range: [0, 300], precision: 3 }
      current: { range: [0, 5], precision: 3 }
  freqctr:
    driver: scpi
    label: Bench frequency counter
    poll_s: 1.0
    config:
      link: freqctr
      channels:
        frequency: { query: "MEAS:FREQ?", unit: Hz }
        duty: { query: "MEAS:DUTY?", unit: "%" }
    signals:
      frequency: { range: [0, 100000], precision: 1 }
      duty: { range: [0, 100], precision: 1 }
  psu:
    driver: scpi
    label: Bench PSU
    poll_s: 1.0
    config:
      link: psu
      channels:
        set_voltage: { write: "SOUR:VOLT {value:.3f}", unit: V }   # [W]
        output_voltage: { query: "MEAS:VOLT?", unit: V }            # [RP], the readback
  # --------------------------------------------------- Modbus register bank --
  plc:
    driver: modbus
    label: PLC registers
    poll_s: 2.0
    config:
      link: plc
      registers:
        pressure2: { address: 0, scale: 0.1, unit: kPa }
        flow: { address: 1, scale: 0.1, unit: L/min }
        tank_pct: { address: 2, scale: 0.01, unit: "%" }
        motor_speed: { address: 3, scale: 1.0, unit: 1/min }
        power: { address: 4, scale: 1.0, unit: W }
        current2: { address: 5, scale: 0.01, unit: A }
    signals:
      pressure2: { range: [0, 500], precision: 1 }
      flow: { range: [0, 100], precision: 1 }
      tank_pct: { range: [0, 100], precision: 2 }
      motor_speed: { range: [0, 3000], precision: 0 }
      power: { range: [0, 10000], precision: 0 }
      current2: { range: [0, 50], precision: 2 }
  # ------------------------------------------------------------- spares --
  # Padding signals: one per plant, mostly units nothing else in this file
  # uses, so the total clears 40 signals across a wide spread of dimensions.
  # `shaker` also carries the third writable device with no controller.
  vibration:
    driver: sim_daq
    label: Shaker table
    poll_s: 0.2
    config:
      link: shaker
      ports:
        speed: { port: output, quantity: speed, unit: m/s }
    signals:
      speed: { range: [0, 2], precision: 3 }
  humidity:
    driver: sim_daq
    label: "Spare: humidity"
    poll_s: 0.5
    config:
      link: humidity_cell
      ports:
        humidity: { port: output, quantity: humidity, unit: "%" }
    signals:
      humidity: { range: [0, 100], precision: 1 }
  count_rate:
    driver: sim_daq
    label: "Spare: count rate"
    poll_s: 1.0
    config:
      link: tach
      ports:
        frequency: { port: output, quantity: frequency, unit: Hz }
    signals:
      frequency: { range: [0, 100], precision: 1 }
  torque:
    driver: sim_daq
    label: "Spare: torque"
    poll_s: 2.0
    config:
      link: wrench
      ports:
        torque: { port: output, quantity: torque, unit: N·m }
    signals:
      torque: { range: [-20, 20], precision: 2 }
  mass:
    driver: sim_daq
    label: "Spare: mass"
    poll_s: 5.0
    config:
      link: hopper
      ports:
        mass: { port: output, quantity: mass, unit: kg }
    signals:
      mass: { range: [0, 200], precision: 2 }
  length:
    driver: sim_daq
    label: "Spare: length"
    poll_s: 0.2
    config:
      link: rail
      ports:
        length: { port: output, quantity: length, unit: m }
    signals:
      length: { range: [-1, 1], precision: 4 }
  energy:
    driver: sim_daq
    label: "Spare: energy"
    poll_s: 0.5
    config:
      link: cell
      ports:
        energy: { port: output, quantity: energy, unit: J }
    signals:
      energy: { range: [0, 1000], precision: 1 }
  charge:
    driver: sim_daq
    label: "Spare: charge"
    poll_s: 1.0
    config:
      link: capacitor
      ports:
        charge: { port: output, quantity: charge, unit: C }
    signals:
      charge: { range: [-1, 1], precision: 4 }
  amount:
    driver: sim_daq
    label: "Spare: amount of substance"
    poll_s: 2.0
    config:
      link: reactor
      ports:
        amount: { port: output, quantity: amount, unit: mol }
    signals:
      amount: { range: [0, 10], precision: 3 }
  drive_fraction:
    driver: sim_daq
    label: "Spare: drive fraction"
    poll_s: 5.0
    config:
      link: knob
      ports:
        fraction: { port: output, quantity: fraction, unit: of full }
    signals:
      fraction: { range: [0, 1], precision: 3 }
  big_volume:
    driver: sim_daq
    label: "Spare: volume (m³)"
    poll_s: 0.2
    config:
      link: silo
      ports:
        volume_m3: { port: output, quantity: volume_m3, unit: m³ }
    signals:
      volume_m3: { range: [0, 5], precision: 3 }
  angle:
    driver: sim_daq
    label: "Spare: angle"
    poll_s: 0.5
    config:
      link: turntable
      ports:
        angle: { port: output, quantity: angle, unit: rad }
    signals:
      angle: { range: [-10, 10], precision: 3 }
  # ---------------------------------------------------------------- furnace --
  # One `sim_daq` for the twelve zone thermocouples and the sample, its
  # per-signal `poll_s` spread on purpose; one `sim_drive` for the heaters.
  furnace:
    driver: sim_daq
    label: Furnace thermocouples
    poll_s: 0.2
    config:
      link: tube
      ports:
        zone1: zone1
        zone2: zone2
        zone3: zone3
        zone4: zone4
        zone5: zone5
        zone6: zone6
        zone7: zone7
        zone8: zone8
        zone9: zone9
        zone10: zone10
        zone11: zone11
        zone12: zone12
        sample: sample
    signals:
      zone1: { label: Zone 1, range: [0, 1300], precision: 1, warn: [25, 1300] }
      zone2: { label: Zone 2, range: [0, 1300], precision: 1, poll_s: 0.5 }
      zone3: { label: Zone 3, range: [0, 1300], precision: 1, poll_s: 1.0 }
      zone4: { label: Zone 4, range: [0, 1300], precision: 1, poll_s: 2.0 }
      zone5: { label: Zone 5, range: [0, 1300], precision: 1, poll_s: 5.0 }
      zone6: { label: "Zone 6 (sample, hot)", range: [0, 1300], precision: 1 }
      zone7: { label: Zone 7, range: [0, 1300], precision: 1, poll_s: 0.5 }
      zone8: { label: Zone 8, range: [0, 1300], precision: 1, poll_s: 1.0 }
      zone9: { label: Zone 9, range: [0, 1300], precision: 1, poll_s: 2.0 }
      zone10: { label: Zone 10, range: [0, 1300], precision: 1, poll_s: 5.0 }
      zone11: { label: Zone 11, range: [0, 1300], precision: 1 }
      zone12: { label: Zone 12, range: [0, 1300], precision: 1, poll_s: 0.5 }
      sample: { label: Sample (zone 6), range: [0, 1300], precision: 1, poll_s: 1.0 }
  burner1:
    driver: sim_drive
    label: Oven 1 heater
    config: { link: oven1, ports: { drive: input } }
  burner2:
    driver: sim_drive
    label: Oven 2 heater
    config: { link: oven2, ports: { drive: input } }
  burner3:
    driver: sim_drive
    label: Oven 3 heater
    config: { link: oven3, ports: { drive: input } }
  valve1:
    driver: sim_drive
    label: Tank 1 inlet valve
    config: { link: tank1, ports: { drive: input } }
  valve2:
    driver: sim_drive
    label: Tank 2 inlet valve
    config: { link: tank2, ports: { drive: input } }
  # vent is a plain drive: no controller, a manual/simulation-only knob.
  vent:
    driver: sim_drive
    label: Vessel vent
    config: { link: vessel, ports: { drive: input } }
  shaker_drive:
    driver: sim_drive
    label: Shaker drive
    config: { link: shaker, ports: { drive: input } }
  heaters:
    driver: sim_drive
    label: Zone heaters
    config:
      link: tube
      ports:
        heater1: heater1
        heater2: heater2
        heater3: heater3
        heater4: heater4
        heater5: heater5
        heater6: heater6
        heater7: heater7
        heater8: heater8
        heater9: heater9
        heater10: heater10
        heater11: heater11
        heater12: heater12
    signals:
      heater1: { label: Zone 1 heater }
      heater2: { label: Zone 2 heater }
      heater3: { label: Zone 3 heater }
      heater4: { label: Zone 4 heater }
      heater5: { label: Zone 5 heater }
      heater6: { label: Zone 6 heater }
      heater7: { label: Zone 7 heater }
      heater8: { label: Zone 8 heater }
      heater9: { label: Zone 9 heater }
      heater10: { label: Zone 10 heater }
      heater11: { label: Zone 11 heater }
      heater12: { label: Zone 12 heater }

# Each bare-plant controller's feedforward is its plant's static inverse
# (`(setpoint - ambient) / gain` for a lag or fopdt, `leak / gain` per unit
# for an integrator), and its law's gains are the old output-unit tunings
# over the plant's gain, so the loops behave as they did when the actuator
# modelled the plant itself. The furnace's are in watts, as before.
controllers:
  heaters.heater1:
    signal: furnace.zone1
    law: { tag: PI, kp: 100, ki: 0.15, tt: 30 }
    feedforward: { tag: none }
  heaters.heater2:
    signal: furnace.zone2
    law: { tag: PID, kp: 100, ki: 0.1, kd: 20, tt: 30 }
    feedforward: { tag: affine, gain: 2.0, bias: 50 }
  heaters.heater3:
    signal: furnace.zone3
    law: { tag: P, kp: 120 }
    feedforward: { tag: table, points: [[20, 0], [200, 289], [400, 660], [600, 1200], [800, 2000], [1000, 2800]] }
  heaters.heater4:
    signal: furnace.zone4
    law: { tag: PI, kp: 100, ki: 0.15, tt: 30 }
    feedforward: { tag: none }
  heaters.heater5:
    signal: furnace.zone5
    law: { tag: PID, kp: 100, ki: 0.1, kd: 20, tt: 30 }
    feedforward: { tag: affine, gain: 2.0, bias: 80 }
  heaters.heater6:
    signal: furnace.zone6
    law: { tag: PI, kp: 100, ki: 0.15, tt: 30 }
    feedforward: { tag: table, points: [[20, 0], [200, 289], [400, 660], [600, 1200], [800, 2000], [1000, 2800]] }
    default: true
  heaters.heater7:
    signal: furnace.zone7
    law: { tag: P, kp: 120 }
    feedforward: { tag: none }
  heaters.heater8:
    signal: furnace.zone8
    law: { tag: PI, kp: 100, ki: 0.15, tt: 30 }
    feedforward: { tag: affine, gain: 1.8, bias: 60 }
  heaters.heater9:
    signal: furnace.zone9
    law: { tag: PID, kp: 100, ki: 0.1, kd: 20, tt: 30 }
    feedforward: { tag: table, points: [[20, 0], [200, 289], [400, 660], [600, 1200], [800, 2000], [1000, 2800]] }
  heaters.heater10:
    signal: furnace.zone10
    law: { tag: P, kp: 120 }
    feedforward: { tag: none }
  heaters.heater11:
    signal: furnace.zone11
    law: { tag: PI, kp: 100, ki: 0.15, tt: 30 }
    feedforward: { tag: affine, gain: 1.5, bias: 40 }
  heaters.heater12:
    signal: furnace.zone12
    law: { tag: PID, kp: 100, ki: 0.1, kd: 20, tt: 30 }
    feedforward: { tag: table, points: [[20, 0], [200, 289], [400, 660], [600, 1200], [800, 2000], [1000, 2800]] }
  burner1.drive:
    signal: temp1.temperature
    law: { tag: P, kp: 0.00045 }
    feedforward: { tag: affine, gain: 0.016666667, bias: -0.33333333 }
  burner2.drive:
    signal: temp2.temperature
    law: { tag: PI, kp: 0.00016, ki: 6e-06 }
    feedforward: { tag: affine, gain: 0.01, bias: -0.2 }
  burner3.drive:
    signal: temp3.temperature
    law: { tag: PID, kp: 7.1333333e-05, ki: 2.6666667e-06, kd: 0.0066666667 }
    feedforward: { tag: affine, gain: 0.0066666667, bias: -0.13333333 }
  valve1.drive:
    signal: level1.volume
    law: { tag: PI, kp: 0.025, ki: 0.005 }
    feedforward: { tag: affine, gain: 0.025 }
  valve2.drive:
    signal: level2.volume
    law: { tag: PID, kp: 0.013333333, ki: 0.0026666667, kd: 0.066666667 }
    feedforward: { tag: affine, gain: 0.026666667 }
