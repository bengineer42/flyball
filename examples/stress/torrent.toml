#:schema ../simulated/rig.schema.json
# A throughput rig: eight noisy channels polled every 0.02-0.05 rig-seconds,
# run at a clock speed chosen so the *wall-clock* sample rate -- what the
# websocket, the recorder and the UI actually have to keep up with -- clears
# 1000 samples/s. See `../README.md` for the measured rate on this machine.
#
#   flyball-daemon torrent.toml --record
#   flyball watch samples          # or count messages on ws://.../ws/samples

name = "torrent"
clock = { speed = 40 }

[links.t1]
tag = "sim_plant"
kind = "lag"
tau_s = 1.0
gain = 1.0
ambient = 0.0
initial = 0.0
noise = 3.0
seed = 1

[links.t2]
tag = "sim_plant"
kind = "lag"
tau_s = 1.0
gain = 1.0
ambient = 0.0
initial = 0.0
noise = 3.0
seed = 2

[links.t3]
tag = "sim_plant"
kind = "lag"
tau_s = 1.0
gain = 1.0
ambient = 0.0
initial = 0.0
noise = 3.0
seed = 3

[links.t4]
tag = "sim_plant"
kind = "lag"
tau_s = 1.0
gain = 1.0
ambient = 0.0
initial = 0.0
noise = 3.0
seed = 4

[links.t5]
tag = "sim_plant"
kind = "lag"
tau_s = 1.0
gain = 1.0
ambient = 0.0
initial = 0.0
noise = 3.0
seed = 5

[links.t6]
tag = "sim_plant"
kind = "lag"
tau_s = 1.0
gain = 1.0
ambient = 0.0
initial = 0.0
noise = 3.0
seed = 6

[links.t7]
tag = "sim_plant"
kind = "lag"
tau_s = 1.0
gain = 1.0
ambient = 0.0
initial = 0.0
noise = 3.0
seed = 7

[links.t8]
tag = "sim_plant"
kind = "lag"
tau_s = 1.0
gain = 1.0
ambient = 0.0
initial = 0.0
noise = 3.0
seed = 8

[[readers]]
period_s = 0.02
[readers.device]
tag = "sim_reader"
name = "channel1"
label = "Channel 1"
link = "t1"
measurand = "signal1"
unit = "V"
range = [-20, 20]
precision = 3

[[readers]]
period_s = 0.025
[readers.device]
tag = "sim_reader"
name = "channel2"
label = "Channel 2"
link = "t2"
measurand = "signal2"
unit = "V"
range = [-20, 20]
precision = 3

[[readers]]
period_s = 0.03
[readers.device]
tag = "sim_reader"
name = "channel3"
label = "Channel 3"
link = "t3"
measurand = "signal3"
unit = "V"
range = [-20, 20]
precision = 3

[[readers]]
period_s = 0.04
[readers.device]
tag = "sim_reader"
name = "channel4"
label = "Channel 4"
link = "t4"
measurand = "signal4"
unit = "V"
range = [-20, 20]
precision = 3

[[readers]]
period_s = 0.05
[readers.device]
tag = "sim_reader"
name = "channel5"
label = "Channel 5"
link = "t5"
measurand = "signal5"
unit = "V"
range = [-20, 20]
precision = 3

[[readers]]
period_s = 0.02
[readers.device]
tag = "sim_reader"
name = "channel6"
label = "Channel 6"
link = "t6"
measurand = "signal6"
unit = "V"
range = [-20, 20]
precision = 3

[[readers]]
period_s = 0.025
[readers.device]
tag = "sim_reader"
name = "channel7"
label = "Channel 7"
link = "t7"
measurand = "signal7"
unit = "V"
range = [-20, 20]
precision = 3

[[readers]]
period_s = 0.03
[readers.device]
tag = "sim_reader"
name = "channel8"
label = "Channel 8"
link = "t8"
measurand = "signal8"
unit = "V"
range = [-20, 20]
precision = 3

# One loop, so the control path is under the same fire hose as the readers.
[[actuators]]
tag = "sim_actuator"
name = "drive1"
label = "Channel 1 drive"
link = "t1"
limits = [-10.0, 10.0]

[[loops]]
channel = "channel1.signal1"
actuator = "drive1"
law = { tag = "P", kp = 0.5 }
default = true
