# The humidity simulation as one runner: `uv run flyball-runner humidity.yaml`
# from examples/humidity (its venv has the humidity drivers). The rig is
# the humidity rig's (https://bengineer42.github.io/humctrl/, its own repo,
# cloned to examples/humidity); this file only says how to serve it.
extends: [../humidity/rig-multi-sensor.yaml, ../humidity/sim.yaml]
runner:
  port: 8001
  root_path: /humidity
  allow_shutdown: true
  store_dir: stores
  programs: ../humidity/programs      # the daemon looks beside THIS file otherwise
  tunings: ../humidity/tunings
  auth:
    anonymous: read  # anyone may watch; the password below to drive
    password: change-me  # `flyball password` for a hashed line, or FLYBALL_PASSWORD
