# The furnace simulation as one runner: `uv run flyball-runner ../examples/site/furnace.yaml`
# from controller. The rig is examples/furnace's; this file only says how to serve it.
extends: [../furnace/rig.yaml]
runner:
  port: 8002
  root_path: /furnace
  allow_shutdown: true
  store_dir: stores
  programs: ../furnace/programs        # the daemon looks beside THIS file otherwise
  tunings: ../furnace/tunings
  auth:
    anonymous: read  # anyone may watch; the token below to drive
    token: change-me  # a bare runner has no password login -- put a real token here, or set FLYBALL_TOKEN
