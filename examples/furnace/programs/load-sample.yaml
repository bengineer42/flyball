# yaml-language-server: $schema=program.schema.json
# The operator in the loop: the program stops and waits for a person twice --
# once to load, once to unload -- and carries on when they press go (or gives
# up after the timeout). `prompt` raises an activity the UI shows as a button.
name: load-sample
description: A short run with two operator prompts, for trying the go button.
steps:
  - regulate: { loop: [heaters.heater1, heaters.heater2, heaters.heater3], setpoint: 20 }
  - prompt: { message: "Load the sample into zone 2, close the door, then press go", timeout: { minutes: 30 } }
  - ramp: { loop: [heaters.heater1, heaters.heater2, heaters.heater3], to: 300, per_minute: 20 }
  - wait: { duration: { minutes: 5 }, message: "soak at 300" }
  - ramp: { loop: [heaters.heater1, heaters.heater2, heaters.heater3], to: 60, per_minute: 20 }
  - manual: [heaters.heater1, heaters.heater2, heaters.heater3]
  - prompt: { message: "Unload the sample, then press go", timeout: { minutes: 30 } }
