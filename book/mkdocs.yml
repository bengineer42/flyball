site_name: Flyball
site_description: Closed-loop control of a quantity with an actuator
site_author: Ben Laurence
docs_dir: src
site_dir: ../build/book
strict: true
repo_url: https://github.com/bengineer42/flyball
repo_name: ""          # the logo alone, no text

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  custom_dir: overrides       # main.html: the noai meta tag on every page
  features:
    # The parts are collapsible groups down the side (no top tabs, no flat
    # section headers): a part opens to its sections, a section to its pages,
    # and the open path shows where the reader is.
    - navigation.indexes
    - navigation.top
    - navigation.path
    - toc.follow
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light }

# Versions: mike deploys each into the gh-pages branch; the theme shows a selector.
extra:
  version:
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.snippets:
      base_path: [!relative $config_dir/src/snippets]
      check_paths: true

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../engine/src]
          options:
            docstring_style: google
            docstring_options: { warn_unknown_params: false, warn_missing_types: false }
            show_source: false
            show_root_heading: true
            show_if_no_docstring: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            extensions:
              - griffe_pydantic: { schema: false }

