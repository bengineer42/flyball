      - Starting a rig:
          - 1-running/runner/index.md
          - Access — the token, a sub-path, stopping: 1-running/runner/access.md
          - Building a rig while it runs: 1-running/runner/building.md
      - The UI:
          - 1-running/ui/index.md
          - Devices: 1-running/ui/devices.md
          - Controllers: 1-running/ui/controllers.md
          - Charts and the Graph page: 1-running/ui/charts.md
          - Sessions: 1-running/ui/sessions.md
