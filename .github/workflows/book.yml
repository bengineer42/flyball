# Builds both books strictly on every push, and publishes them as versions with
# mike into the gh-pages branch, which GitHub Pages serves:
#   push to main   → /dev/          (and /humidity/dev/)
#   tag v1.2       → /1.2/ = /latest/ (and /humidity/1.2/ = /humidity/latest/)
# One-off setup: repository Settings → Pages → Source: "Deploy from a branch",
# branch gh-pages, folder / (root).
name: book

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # mike commits to gh-pages, so the branch must be here
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Which version this is
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "alias=latest" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev" >> "$GITHUB_OUTPUT"
            echo "alias=" >> "$GITHUB_OUTPUT"
          fi

      - name: The main book — build strict, then deploy the version
        working-directory: controller
        run: |
          uv sync --group docs
          uv run --group docs mkdocs build -f ../book/mkdocs.yml --strict --site-dir /tmp/strict-check
          uv run --group docs mike deploy -F ../book/mkdocs.yml --push --update-aliases \
            "${{ steps.version.outputs.name }}" ${{ steps.version.outputs.alias }}
          # The root redirects to latest once a tag exists, to dev until then.
          uv run --group docs mike list -F ../book/mkdocs.yml | grep -q '\[latest' \
            && uv run --group docs mike set-default -F ../book/mkdocs.yml --push latest \
            || uv run --group docs mike set-default -F ../book/mkdocs.yml --push dev

      - name: The humidity book — the same, under /humidity/
        working-directory: examples/humidity
        run: |
          uv sync
          uv run --with mkdocs-material --with "mkdocstrings[python]" --with griffe-pydantic --with mike \
            mkdocs build -f book/mkdocs.yml --strict --site-dir /tmp/strict-check-humidity
          uv run --with mkdocs-material --with "mkdocstrings[python]" --with griffe-pydantic --with mike \
            mike deploy -F book/mkdocs.yml --deploy-prefix humidity --push --update-aliases \
            "${{ steps.version.outputs.name }}" ${{ steps.version.outputs.alias }}
          MIKE='uv run --with mkdocs-material --with mkdocstrings[python] --with griffe-pydantic --with mike mike'
          $MIKE list -F book/mkdocs.yml --deploy-prefix humidity | grep -q '\[latest' \
            && $MIKE set-default -F book/mkdocs.yml --deploy-prefix humidity --push latest \
            || $MIKE set-default -F book/mkdocs.yml --deploy-prefix humidity --push dev

      - name: robots.txt at the site root (mike leaves files it does not own alone)
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cp book/robots.txt /tmp/gh-pages/robots.txt
          cd /tmp/gh-pages
          git add robots.txt
          git diff --cached --quiet || { git commit -m "robots.txt: ask AI crawlers not to train on the book"; git push origin HEAD:gh-pages; }
