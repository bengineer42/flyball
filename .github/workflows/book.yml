# Publishes the book to GitHub Pages as two versions, regenerated from the
# two branches on every run — nothing built is kept in git:
#   /latest/     the main branch
#   /dev/        the dev branch
# A push to either branch republishes both. The root redirects to latest.
# One-off setup: repository Settings → Pages → Source: "GitHub Actions".
# The humidity rig's own book (github.com/bengineer42/humctrl) publishes itself, since it split
# out of examples/humidity into its own repo 22 Sep — see book/versions.py's docstring.
name: book

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # both branches, whichever one triggered this
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build latest (main) and dev of both books
        working-directory: engine
        run: |
          git fetch origin main dev
          uv sync --group docs
          uv run --group docs python ../book/versions.py "$GITHUB_WORKSPACE/build/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
