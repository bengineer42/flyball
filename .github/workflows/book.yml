# Publishes both books to GitHub Pages, every version at once, regenerated
# from sources on each run — nothing built is kept in git:
#   /0.1/, /0.2/ …        one per tag v0.1, v0.2 …; the newest is also /latest/
#   /dev/                  the working tree of the ref this ran on
#   /humidity/…            the same for the humidity book
# Runs on a tag, or by hand (Actions → book → Run workflow) to refresh /dev/.
# A push to main publishes nothing on its own.
# One-off setup: repository Settings → Pages → Source: "GitHub Actions".
name: book

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # every tag, to build every version
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build every version of both books
        working-directory: controller
        run: |
          uv sync --group docs
          uv run --group docs python ../book/versions.py "$GITHUB_WORKSPACE/build/site" --dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
