[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flyball-qcodes"
version = "0.1.0"
description = "A QCoDeS instrument's parameters as a flyball device"
requires-python = ">=3.12"
authors = [{ name = "Ben Laurence" }]
dependencies = ["flyball"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
# Nothing here imports qcodes at module load: QCoDeSConfig.build does, so
# this extra is only needed where a real instrument is actually built.
qcodes = ["qcodes>=0.45"]

# What `flyball rig check`, the runner and the schema load to make `driver: qcodes` valid.
[project.entry-points."flyball.configs"]
qcodes = "flyball_qcodes"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "flyball-modbus", "flyball-visa", "flyball-sim"]

[tool.uv.sources]
flyball = { path = "../../engine", editable = true }
flyball-modbus = { path = "../modbus", editable = true }
flyball-visa = { path = "../visa", editable = true }
flyball-sim = { path = "../../sim", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/flyball_qcodes"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../engine/pyproject.toml"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF", "D"]
