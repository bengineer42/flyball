[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flyball-modbus"
version = "0.1.0"
description = "Modbus TCP/RTU register links and the generic modbus device"
requires-python = ">=3.12"
authors = [{ name = "Ben Laurence" }]
dependencies = ["flyball"]
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
# ModbusLink imports pymodbus only when a real client is built; FakeRegisterLink needs nothing.
modbus = ["pymodbus>=3.6"]

# What `flyball rig check`, the runner and the schema load to make `driver: modbus` valid.
[project.entry-points."flyball.configs"]
modbus = "flyball_modbus.configs"

[dependency-groups]
# flyball-sim: RigConfig.build() reaches for a stepped/scaled clock whenever
# no clock is given and every link is fake_*/sim_* -- true of the
# fake_registers bench rig this package's own tests build.
dev = ["pytest>=8.0", "ruff>=0.8", "flyball-sim"]

[tool.uv.sources]
flyball = { path = "../../engine", editable = true }
flyball-sim = { path = "../../sim", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/flyball_modbus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../../engine/pyproject.toml"
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF", "D"]
