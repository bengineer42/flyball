# Searchable catalogue of every flyball_linux driver/link, pre-existing and new.
# Every entry here is decoded from a datasheet and, per brain/plans/roadmap-upgrades.md,
# has never been run against real hardware -- see each driver's own module docstring
# for the authoritative "what's verified vs [Unverified]" statement; `verified` below
# is a coarse summary of that, not a substitute for reading it.
#
# Fields:
#   tag            the DriverConfig/Config tag string used in a rig file's `driver:`
#   part_number, manufacturer
#   category       temp | humidity | pressure | gas | liquid | weight | light | actuator | link
#   interface      i2c_table | i2c_bespoke | uart | spi | analog_adc | gpio | pulse | 4-20ma | onewire | pwm
#   tier           config_only | generic_link | bespoke_driver
#   file           path under src/flyball_linux/
#   loc_estimate, loc_actual
#   status         done | in_progress | planned
#   verified       true (datasheet-confirmed throughout) | partial (some fields [Unverified]) | false
#   price_approx   rough unit cost, [Unverified] unless noted -- for BOM planning, not a quote
#   domains        which roadmap leads this serves (see brain/plans/roadmap-upgrades.md)
#   links          relatively-static reference URLs (datasheet, product page, purchase link,
#                  reference driver source) -- only URLs an agent actually cited; "TODO" where
#                  none was captured, never a guessed URL

