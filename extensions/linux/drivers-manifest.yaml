# Searchable catalogue of every flyball_linux/flyball_chips driver and link.
# Every entry here is decoded from a datasheet and has never been run against
# real hardware except where `hardware_tested: true` says otherwise -- see
# each driver's own module docstring for the authoritative "what's checked
# vs [Unverified]" statement; `datasheet_checked` below is a coarse summary
# of that, not a substitute for reading it.
#
# Fields:
#   type               the DriverConfig/Config type string used in a rig file's `driver:`
#   part_number, manufacturer
#   category           temp | humidity | pressure | gas | liquid | weight | light | actuator | link
#   interface          i2c_table | i2c_bespoke | uart | spi | analog_adc | gpio | pulse | 4-20ma | onewire | pwm
#   tier               config_only | generic_link | bespoke_driver
#   file               path from the repo root -- `extensions/linux/src/flyball_linux/...` or
#                      `extensions/chips/src/flyball_chips/...` depending which package ships it
#   loc_estimate, loc_actual
#   status             done | in_progress | planned
#   datasheet_checked  true (datasheet-confirmed throughout) | partial (some fields [Unverified]) | false
#   hardware_tested    true only where this driver has actually run against real hardware;
#                      false (the default) everywhere else
#   price_approx       rough unit cost, [Unverified] unless noted -- for BOM planning, not a quote
#   domains            which application(s) this serves
#   links              relatively-static reference URLs (datasheet, product page, purchase link,
#                      reference driver source) -- only URLs actually checked while building the
#                      entry; "TODO" where none was captured, never a guessed URL

