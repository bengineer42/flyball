[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flyball-linux"
version = "0.1.0"
description = "Linux I/O for flyball rigs: I2C, SPI, GPIO, PWM and 1-Wire links and the devices on them"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ben Laurence" }]
dependencies = ["flyball", "flyball-sim", "flyball-chips"]

[project.optional-dependencies]
# Each bus library only when that bus is used; the configs import without them.
i2c = ["smbus2>=0.4"]
spi = ["spidev>=3.6"]
gpio = ["gpiod>=2.1"]
serial = ["pyserial>=3.5"]
all = ["flyball-linux[i2c,spi,gpio,serial]"]

# What `flyball rig check`, the runner and the schema load to make these tags valid.
[project.entry-points."flyball.configs"]
linux = "flyball_linux.configs"

# Where `flyball.runtime.config.board_dirs()` finds this package's board profiles.
[project.entry-points."flyball.board_dirs"]
linux = "flyball_linux.boards._dir:board_dir"

[project.scripts]
flyball-linux = "flyball_linux.probe:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "pyyaml>=6"]  # the examples are YAML

[tool.uv.sources]
flyball = { path = "../../engine", editable = true }
flyball-sim = { path = "../../sim", editable = true }
flyball-chips = { path = "../chips", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/flyball_linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
extend = "../../engine/pyproject.toml"
src = ["src"]

[tool.pyright]
# gpiod, smbus2 and spidev are optional extras (i2c/spi/gpio), imported lazily
# inside each real link's __init__ and not installed in the dev venv: pyright
# cannot resolve them, but the missing import is the point, not a bug.
reportMissingImports = "warning"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "RUF", "D"]
