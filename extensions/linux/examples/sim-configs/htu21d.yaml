# Sim for the HTU21D driver (`htu21d`, `humidity`/`temperature` [RP], flat
# -- same shape and caveats as sim-configs/sht31.yaml: no base example to
# overlay yet, two small plants rather than one shared (see README).
# Humidity tau 45 s, ambient 45 %RH; temperature tau 30 s, ambient 21 degC.

links:
  humidity_plant: { type: sim_plant, tau_s: 45.0, gain: 30.0, ambient: 45.0, initial: 45.0, noise: 0.3, seed: 12 }
  temperature_plant: { type: sim_plant, tau_s: 30.0, gain: 5.0, ambient: 21.0, initial: 21.0, noise: 0.05, seed: 13 }

devices:
  humidity:
    driver: sim_daq
    label: Humidity (simulated)
    poll_s: 2
    link: humidity_plant
    ports:
      humidity: { port: output, quantity: humidity, unit: "%RH" }

  humidity_temperature:
    driver: sim_daq
    label: Humidity sensor temperature (simulated)
    poll_s: 2
    link: temperature_plant
    ports:
      temperature: { port: output, quantity: temperature, unit: "°C" }
