# Overlay for ../sensors/ph_probe.yaml: no hardware. `ph_adc` swaps
# `ads1115` for `sim_daq`; the `curve` device that turns its volts into pH
# is the base file's, unchanged. `ph_plant` settles around neutral (tau
# 5 s -- a probe's electrode responds in seconds, ambient 7.0, gain 3.0 so
# it can swing 4-10) in "volts" that the base file's placeholder line
# (scale 1, offset 0) reads as the same number of pH.

links:
  i2c1: null
  ph_plant: { type: sim_plant, tau_s: 5.0, gain: 3.0, ambient: 7.0, initial: 7.0, noise: 0.02, seed: 5 }

devices:
  ph_adc:
    driver: sim_daq
    label: pH probe (simulated)
    poll_s: 2
    i2c_address: null
    gain: null
    channels: null
    link: ph_plant
    ports:
      raw_v: { port: output, quantity: voltage, unit: V }
