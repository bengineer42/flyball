# Overlay for ../sensors/turbidity.yaml: no hardware. `turbidity_adc` swaps
# `ads1115` for `sim_daq`; the `curve` device that turns its volts into NTU
# is the base file's, unchanged. `turbidity_plant` settles fast (tau 3 s --
# an optical scatter reading has no real lag) around a clear-water baseline
# (ambient 4.1 V, the base file's "clear water" voltage), dipping towards
# 0 V as simulated turbidity rises; below the table's lowest volts the curve
# has no value, as it would on the bench.

links:
  i2c1: null
  turbidity_plant: { type: sim_plant, tau_s: 3.0, gain: -3.5, ambient: 4.1, initial: 4.1, noise: 0.02, seed: 6 }

devices:
  turbidity_adc:
    driver: sim_daq
    label: Turbidity sensor (simulated)
    poll_s: 2
    address: null
    gain: null
    channels: null
    link: turbidity_plant
    ports:
      raw_v: { port: output, quantity: voltage, unit: V }
