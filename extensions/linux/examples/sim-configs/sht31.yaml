# Sim for the SHT31 driver (`sht31`, `humidity`/`temperature` [RP], flat --
# no `../sensors/sht31.yaml` exists in this tree yet to overlay; layer
# this the same way once one lands: null its `i2c1`/`address`, keep the
# device key). Humidity and temperature would plausibly move together in
# a room, but a bare `sim_plant` has one scalar output and a `sim_daq`
# binds one link, so faking that correlation needs a bespoke multi-output
# plant (as the humidity rig has, https://bengineer42.github.io/humctrl/);
# out of scope here (see README) --
# each gets its own small plant instead: humidity tau 45 s, ambient
# 45 %RH; temperature tau 30 s, ambient 21 degC.

links:
  humidity_plant: { tag: sim_plant, tau_s: 45.0, gain: 30.0, ambient: 45.0, initial: 45.0, noise: 0.3, seed: 10 }
  temperature_plant: { tag: sim_plant, tau_s: 30.0, gain: 5.0, ambient: 21.0, initial: 21.0, noise: 0.05, seed: 11 }

devices:
  humidity:
    driver: sim_daq
    label: Humidity (simulated)
    poll_s: 2
    link: humidity_plant
    ports:
      humidity: { port: output, quantity: humidity, unit: "%RH" }

  humidity_temperature:
    driver: sim_daq
    label: Humidity sensor temperature (simulated)
    poll_s: 2
    link: temperature_plant
    ports:
      temperature: { port: output, quantity: temperature, unit: "°C" }
