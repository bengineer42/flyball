# yaml-language-server: $schema=../rig.schema.json
# Generic analog pH probe + breakout (e.g. DFRobot Gravity pH SEN0161-style:
# a BNC pH electrode into an amplifier board that outputs 0-3.0 V-ish over
# its usable range), read on an ADS1115 channel. This is not a register
# map to look up -- there is no digital protocol here, just a voltage --
# so there is nothing to cite beyond the ADS1115 driver itself.
#
# The channel is read once, as volts (`ph_adc.raw_v`), and a `curve`
# device turns that into pH (`ph.value`). Reading it once matters: each
# ADS1115 conversion is ~9 ms, per declared signal.
#
# pH is NOT computable from a fixed line in this file: every probe and
# amplifier board has its own slope and zero point, and both drift with
# electrode age and temperature. `scale`/`offset` below are placeholders
# (a straight line, 0 V -> pH 0, one pH per volt) -- replace them with
# your own two-point calibration:
#
#   1. Rinse the probe, dip in pH 7.00 buffer, let it settle, read `ph_adc.raw_v`.
#   2. Rinse, dip in pH 4.00 buffer, let it settle, read `ph_adc.raw_v` again.
#   3. slope_v_per_ph = (v_at_ph4 - v_at_ph7) / (4.00 - 7.00)
#      offset_ph      = 7.00 - v_at_ph7 / slope_v_per_ph
#      scale          = 1 / slope_v_per_ph      # the curve's `scale * volts + offset`
#      offset         = offset_ph
#   4. Re-check against a third buffer (e.g. pH 10) before trusting it.
#   5. Repeat periodically -- probes drift over weeks to months.
#
# A probe whose response bends can use `{type: table, points: [[volts, pH],
# ...]}` instead, one point per buffer. `raw_v` is `record: false`: it is
# live, and shown beside `ph.value`, so recalibration can be done without
# editing this file until the new numbers are known, but the store keeps
# only pH; drop that line to keep the volts too.

devices:
  ph_adc:
    driver: ads1115
    label: pH probe
    poll_s: 2
    link: i2c1
    i2c_address: 0x48
    gain: 1                          # +-4.096 V full scale; probe boards are typically 0-3ish V
    channels:
      raw_v: { channel: 0, unit: V }
    signals:
      raw_v: { record: false }
  ph:
    driver: curve
    label: pH
    inputs: { x: ph_adc.raw_v }
    unit: pH
    curve: { type: linear, scale: 1.0, offset: 0.0 }   # PLACEHOLDER: replace via calibration above
