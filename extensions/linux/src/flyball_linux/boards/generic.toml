# Any Linux machine with one I2C adapter at /dev/i2c-1 and one GPIO chip:
# a USB bridge (FT232H, CH341) on a laptop, or a board with no profile yet.
# Copy, rename, and fix the numbers `flyball-linux probe` reports.

name = "Generic Linux"

[links.i2c1]
type = "i2c"
bus = 1

[links.gpio]
type = "gpio"
chip = "gpiochip0"

[pins]
