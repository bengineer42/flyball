[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flyball"
description = "Closed-loop control of a quantity with an actuator: control laws, runtime, telemetry, identification"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Ben Laurence" }]
dynamic = ["version"]

# The controller and the SQLite store are stdlib-only; pydantic is the one
# hard requirement, for configs and the schemas built from them. flyball-sim
# (`../sim`) depends on bare flyball, so it cannot be a hard dependency here
# too without a cycle; it is pulled in by the `web` extra instead (below),
# which is what `flyball-runner` needs anyway -- `pip install flyball[web]`
# still runs a simulated rig with nothing plugged in. Everything that talks
# to real hardware or the network is an extra.
dependencies = ["pydantic>=2.9", "tomli-w>=1.0"]  # tomli-w: saving a rig file

classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.optional-dependencies]
# FastAPI won: flyball.interfaces.server needs its WebSocket support for live telemetry
# and pydantic for request validation. uvicorn is the ASGI server.
# The runner also serves MCP at /mcp/<mode>, over the client pointed back at itself.
# flyball-sim rides along too, so `flyball-runner` can serve examples/simulated
# out of the box (Decision, extensions-restructure Phase 8): its sim_plant/
# sim_daq/sim_drive tags register through the same flyball.configs entry
# point every other optional package uses, and runtime/config.py's clock
# builder imports it lazily, only for a rig whose links are all sim_*/fake_*.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pyyaml>=6", "flyball[mcp]", "flyball-sim"]
# flyball.interfaces.client talks to a runner over HTTP and websockets and imports
# nothing from the rig: it runs anywhere.
cli = ["httpx>=0.27", "websockets>=13", "pyyaml>=6"]  # program files are YAML
# Links to instruments (flyball.hardware.links's RegisterLink/TextLink
# protocols). The fakes, real implementations and `modbus`/`visa`/`serial`
# extras of the same name live in extensions/modbus, extensions/visa now --
# each its own installable package, same as Bluesky, QCoDeS and PyMeasure
# (extensions/{bluesky,qcodes,pymeasure}).
# flyball.interfaces.mcp on its own: the stdio server, for a machine that reaches the rig but is not it.
mcp = ["flyball[cli]", "mcp>=1.12"]
all = ["flyball[cli,web]"]

[project.scripts]
flyball-runner = "flyball.runner:main"
flyball-mcp = "flyball.interfaces.mcp.server:main"

# Engine's own built-in laws, registered through the same `flyball.configs`
# mechanism as every extension -- no special-cased "what's compiled in" path
# (brain/tasks/registry-redesign.md).
[project.entry-points."flyball.configs"]
flyball = "flyball.control.configs"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
    "ipykernel>=7.3.0",
    "flyball-sim",  # engine's own tests use SteppedClock/ScaledClock as scaffolding
    "furnace",  # examples/stress's chaos.yaml/plant.yaml use its sim_furnace tag
    "flyball-visa",  # example/stress rigs and the hardware-gate tests use visa/fake_text
    "flyball-modbus",  # example/stress rigs use modbus/fake_registers
]
# The books under book/ and examples/*/book/ are MkDocs sites; mkdocstrings
# renders the Python reference from docstrings, griffe-pydantic the model fields.
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "griffe-pydantic>=1.0",
]

[tool.uv.sources]
flyball-sim = { path = "../sim", editable = true }
furnace = { path = "../examples/furnace", editable = true }
flyball-visa = { path = "../extensions/visa", editable = true }
flyball-modbus = { path = "../extensions/modbus", editable = true }

[tool.hatch.version]
path = "src/flyball/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flyball"]

# Pulls the built dashboard UI into the wheel from outside the package root
# (ui/ is a separate npm workspace, two directories up from engine/). This
# requires `ui/apps/dashboard` to have been built (`npm run build`) BEFORE
# `hatch build`/`uv build` runs -- hatchling only copies files that already
# exist at build time, it does not (and cannot) invoke npm itself.
#
# A plain `[tool.hatch.build.targets.wheel.force-include]` entry would work
# for CI (which always builds the UI first) but fails hard -- FileNotFoundError
# -- the moment the source directory is missing, which it is on every ordinary
# dev checkout (`ui/apps/dashboard/dist` is gitignored) and would break
# `uv sync`/`make test`'s editable install for anyone who hasn't run
# `npm run build`. `hatch_build.py`'s build hook does the same force-include,
# but only when the built dist actually exists, so a dev checkout without it
# still installs/tests fine (see server/app.py's fallback for what that means
# for serving the UI at runtime).
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
preview = true


[tool.ruff.lint]
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF",
    "D",   # pydocstyle
]

# Docstrings are Google style. The missing-docstring rules stay off: the house
# style documents what needs explaining, not every definition.
ignore = ["undocumented-public-module", "undocumented-public-class", "undocumented-public-method", "undocumented-public-function", "undocumented-public-package", "undocumented-magic-method", "undocumented-public-nested-class", "undocumented-public-init"]

# Greek quantity and unit symbols (ρ, µ, Ω...) are the SI's, not typos.
allowed-confusables = ["α", "γ", "ε", "η", "λ", "µ", "μ", "ν", "ρ", "σ", "ω", "Ω", "Φ", "Θ"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests compare against exact literals on purpose; ``pytest.approx`` is used where a value is computed.
"tests/*" = ["magic-value-comparison", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["flyball"]
strict = true
warn_unreachable = true

# Enforces the layering by hand rather than by splitting into separate
# distributions: packages on one line are mutually independent, and nothing
# below may import anything above. The Bluesky, QCoDeS and PyMeasure adapters
# moved out to extensions/{bluesky,qcodes,pymeasure}; flyball.sim moved out to
# flyball-sim (its own top-level package, ../sim); flyball.devices (the
# generic `scpi`/`modbus` drivers) moved out to extensions/{visa,modbus} --
# all depend only on flyball.foundation (and, for Bluesky and flyball-sim's
# Simulation, flyball.runtime.rig/config), so none of them is a layer here
# any more. Run with `uv run lint-imports`.
#
# flyball.rig (engine-structure.md layer 3) is deliberately left OUT of this
# ordered list, not merged into flyball.runtime's line either: the two are
# genuinely bidirectionally coupled today, not just incidentally. flyball.rig
# is authorized to keep this shape by engine-structure.md's own rig-move step.
# flyball.runtime.config/writer/recorder import Rig at real (non-deferred)
# module level to build/type one; flyball.rig.rig in turn imports
# flyball.runtime.writer at module level (the Writer it hands blocking
# devices to) and flyball.runtime.config/recorder inside two methods
# (deferred, to break the import cycle at load time, but still a real edge --
# import-linter's layers contract statically flags deferred imports the same
# as top-level ones, checked directly: both "runtime | rig" as siblings and
# "rig" below "runtime" broke the contract for this reason). A strict order
# would require finishing core-split.md's parked runtime/config.py split
# (its schema/runner/rig/boards/documents concerns) so the pieces rig
# actually needs move out of runtime -- out of scope here. Until then,
# `flyball.rig` stays unlisted (unconstrained by this contract, same as
# `flyball.scaffold` already is) rather than encoding a layering that isn't
# true yet.
#
# `flyball.model` (engine-structure.md layer 2) is deliberately left OUT of
# this list too, for the same reason as flyball.rig above: a real,
# unavoidable cycle, not an oversight. `flyball.control` (laws/feedforwards/
# generators that ship) imports `ControlLaw`/`Feedforward`/`SetPointGenerator`
# from `flyball.model`, so model has to sit below control -- but
# `flyball.foundation.device.device.DriverConfig` subclasses `flyball.model
# .config.Config` (`Config[T]`'s home moved out of `foundation/config/` to
# `model/` with the registry redesign), so model also has to sit below
# foundation, model's own supposed base layer. Checked directly
# (`uv run lint-imports`): listing model anywhere between control and
# foundation breaks on `foundation.device.device -> model.config`, not on
# anything model-internal. Fixing this for real means moving `DriverConfig`
# itself into `model/` (it's conceptually the Config tier of the device
# Catalog per engine-structure.md's own description) -- out of scope for the
# agent that split control/controller.py|types.py into model/, since it
# wasn't chartered to touch `foundation/device/device.py`'s device-tree code.
# Until then, `flyball.model` stays unlisted rather than asserting an order
# that isn't true; `flyball.control`, `flyball.foundation` and everything
# above both are still fully ordered and enforced against each other.
#
# `flyball.library` (layer 4, saved/named Configs -- `Tuning`/`Tunings` so
# far) sits below the hardware|adaptive|autotune|record line, not above:
# `flyball.autotune.types.Gains.to_tuning` builds a `library.tunings.Tuning`
# directly (checked: `uv run lint-imports` broke on
# `autotune.types -> library.tunings` when library was placed higher).
# `flyball.library.tunings` itself imports `flyball.control.laws.OpenLoop`
# (deferred, inside a function, to build `OpenLoopTuning` -- still a real
# edge import-linter's layers contract catches) so library sits above
# control too, per the ordering below.
[tool.importlinter]
root_packages = ["flyball"]

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "flyball.runner",
    "flyball.interfaces.mcp | flyball.interfaces.server",
    "flyball.programmer",
    "flyball.runtime",
    "flyball.hardware | flyball.adaptive | flyball.autotune | flyball.record",
    "flyball.library",
    "flyball.control",
    "flyball.foundation",
]

[[tool.importlinter.contracts]]
name = "The client, the scaffold and the MCP server stand alone"
type = "forbidden"
source_modules = ["flyball.interfaces.client", "flyball.scaffold", "flyball.interfaces.mcp"]
forbidden_modules = [
    "flyball.foundation", "flyball.control", "flyball.model", "flyball.library", "flyball.runtime", "flyball.rig", "flyball.interfaces.server", "flyball.programmer",
]
